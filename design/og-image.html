<!doctype html>
<!--
  Source for public/og-image.png -- the link preview card.

  Render it with design/render-og-image.mjs, which screenshots this at
  1200x630. Keep this file: the previous banner existed only as a PNG, so
  changing one line of it meant measuring colours out of the pixels and
  guessing the font.

  Two things are deliberate. The font is DejaVu Sans because that is what the
  original was rendered with, and anything else visibly changes the
  letterforms. And no keyboard is named: more are planned, and a banner that
  lists two of them dates itself the moment a third arrives.
-->

      * {

        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        background: #0d0f16;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "DejaVu Sans", sans-serif;
        overflow: hidden;
        position: relative;
      }
      /* A corner accent, kept clear of the type. */
      .disc {
        position: absolute;
        right: -210px;
        bottom: -330px;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: #161a26;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 56px;
        position: relative;
        z-index: 1;
        /* The type's right edge is ragged -- "Keeb-On!" is wider than the lines
       under it -- so centring the box leaves it looking a few pixels left.
       This balances the ink rather than the box. */
        transform: translateX(5px);
      }
      .mark {
        width: 300px;
        height: 372px;
        display: block;
      }
      .mark svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .words {
        display: flex;
        flex-direction: column;
      }
      .name {
        font-size: 96px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.02em;
        line-height: 1.04;
      }
      .studio {
        font-size: 96px;
        font-weight: 700;
        color: #c9a227;
        letter-spacing: -0.02em;
        line-height: 1.04;
      }
      .rule {
        width: 140px;
        height: 5px;
        background: #3d6fac;
        margin: 20px 0 18px;
        border-radius: 3px;
      }
      .url {
        font-size: 31px;
        font-weight: 400;
        color: #3d6fac;
      }
    </style>
