# `run_worker_first` is what makes the two halves coexist: without it the SPA
# not-found rule answers /api/* with index.html and the Worker never runs.
# Everything outside /api/ is served straight from the assets, as before.
compatibility_date = "2024-06-11"
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.dev]
name = "keeb-on-studio-dev"

# Created with:
#   npx wrangler kv namespace create GALLERY --env dev
# and the id it prints goes here. The two environments get separate
# namespaces so testing against dev cannot publish into the real gallery.
[[env.dev.kv_namespaces]]
binding = "GALLERY"
id = "REPLACE_WITH_DEV_NAMESPACE_ID"

[env.release]
name = "keeb-on-studio"

[[env.release.kv_namespaces]]
binding = "GALLERY"
id = "REPLACE_WITH_RELEASE_NAMESPACE_ID"
